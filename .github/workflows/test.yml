name: audit-clean-compaction

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run complete audit, tamper, compaction, and 10k release gate
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python scripts/release_check.py
      - name: Verify packaged demo outputs
        run: |
          python -m openline_half_life demo --out build/demo --replay-latency-micros 75000
          python -m openline_half_life verify build/demo \
            --policy-public-key policy/succession_policy_public_key.hex \
            --compaction-policy-public-key policy/compaction_policy_public_key.hex
