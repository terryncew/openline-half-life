name: verified-state-compaction

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Remove stale files from overlay checkouts
        run: python scripts/normalize_checkout.py --root . --manifest RELEASE_MANIFEST.json
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Unit and adversarial tests
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q
      - name: Small seeded equivalence check
        run: python scripts/seeded_gate.py --count 100
      - name: Full release checks
        if: matrix.python-version == '3.12'
        run: python scripts/release_check.py
