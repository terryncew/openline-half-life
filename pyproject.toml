[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openline-half-life"
version = "0.3.0rc2"
description = "A deterministic OLP harness for verified succession, causal receipt compaction, and break-even economics."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Terrynce White"}]
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "setuptools>=68"]
providers = []

[project.scripts]
openline-half-life = "openline_half_life.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["openline_half_life*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
openline_half_life = [
  "data/fixtures/*.jsonl",
  "data/fixtures/*.hex",
  "data/exams/*.json",
  "data/policy/*.json",
  "data/policy/*.hex",
  "data/economics/*.json",
]
