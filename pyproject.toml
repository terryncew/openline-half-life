[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openline-half-life"
version = "0.3.0rc4"
description = "A cross-platform save-file harness for verified AI-agent continuity across models."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Terrynce White"}]
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "setuptools>=68", "build>=1.2", "twine>=6"]
providers = []

[project.scripts]
openline-half-life = "openline_half_life.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["openline_half_life*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
openline_half_life = [
  "data/fixtures/*.jsonl",
  "data/fixtures/*.hex",
  "data/exams/*.json",
  "data/policy/*.json",
  "data/policy/*.hex",
  "data/economics/*.json",
]

[project.urls]
Homepage = "https://terryncew.github.io/openline-half-life/"
Repository = "https://github.com/terryncew/openline-half-life"
Issues = "https://github.com/terryncew/openline-half-life/issues"

