[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openline-half-life"
version = "0.4.0rc1"
description = "Verified state compaction with independent replay and recoverable archives."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Terrynce White"}]
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "setuptools>=68", "build>=1.2"]

[project.scripts]
openline-half-life = "openline_half_life.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["openline_half_life*"]

[tool.setuptools.package-data]
openline_half_life = [
  "data/fixtures/*.jsonl",
  "data/fixtures/*.hex",
  "data/policy/*.json",
  "data/policy/*.hex",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.urls]
Repository = "https://github.com/terryncew/openline-half-life"
